<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Secrétaire - MediCare+</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-100 to-blue-50 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md p-8 bg-white rounded-3xl shadow-2xl border border-gray-200">
    <h1 class="text-center text-3xl font-extrabold text-blue-700 mb-6">MediCare+ <span class="text-gray-500 text-lg font-normal">Secrétaire</span></h1>

    <form id="login" class="space-y-6">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Nom d’utilisateur</label>
        <input id="username" type="text" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Entrez votre nom" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Mot de passe</label>
        <input id="password" type="password" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Entrez votre mot de passe" />
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg shadow hover:bg-blue-700 transition duration-300 ease-in-out">Se connecter</button>
    </form>

    <p class="text-center text-gray-400 text-sm mt-6">© 2025 MediCare+. Tous droits réservés.</p>
  </div>
  <script src="../medicare-2/js/login.js"></script>
</body>
</html>
