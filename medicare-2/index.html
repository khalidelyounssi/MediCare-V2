  <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
      <link rel="stylesheet" href="./src/styles.css">

</head>
<body>
<body class="bg-blue-50 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm p-6 bg-white rounded-2xl shadow-lg">
    <h1 class="text-center text-2xl font-bold mb-4">Espace Secrétaire - MediCare+</h1>

    <form id="login" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium mb-1">Nom d’utilisateur</label>
        <input id="username" class="w-full border rounded p-2" placeholder="Entrez votre nom"/>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium mb-1">Mot de passe</label>
        <input id="password" type="password" class="w-full border rounded p-2" placeholder="Entrez votre mot de passe" />
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Se connecter</button>
    </form>
  </div>

  <script src="../medicare-2/js/login.js"></script>
</body>
</html>
