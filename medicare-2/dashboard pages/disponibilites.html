             <h1 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
      Gérer les disponibilités des médecins
    </h1>

    <!-- Sélection du médecin -->
    <div class="mb-8">
      <label for="medecin" class="block text-sm font-medium text-gray-700 mb-2">
        Sélectionner un médecin
      </label>
      <select  id="medecin" class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <option>-- Choisir un médecin --</option>
      </select>
    </div>


    <div id="parti-disponibilite"></div>


</main>
    </div>

    

    <script>

      let mede;
 
    let despo = JSON.parse(localStorage.getItem('disponibilites'))
  
   
// Charger les données sauvegardées
    const data = localStorage.getItem("medicareDoctors");
    if (data) {
      mede = JSON.parse(data);
      console.log(mede)
    }

    const selectMedecin = document.getElementById("medecin");
    const partiDisponibilite = document.getElementById("parti-disponibilite");

    // Remplir le select
    mede.forEach((m, index) => {
      const opt = document.createElement("option");
      opt.value = index;
      opt.textContent = `${m.name} (${m.specialty})`;
      selectMedecin.appendChild(opt);
    });

    // Quand on choisit un médecin
    selectMedecin.addEventListener("change", () => {
      const index = selectMedecin.value;
      if (index === "") {
        partiDisponibilite.innerHTML = "";
        return;
      }
      afficheDisponibilite(index);
    });

    // Fonction d'affichage
    function afficheDisponibilite(index) {
      const medecin = mede[index];
      const jours = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"];
    
          const checkboxesHTML = jours.map(jour => `
        <label class="flex items-center space-x-2">
          <input type="checkbox" class="jour-checkbox text-indigo-600" value="${jour}"
            ${medecin.jours.includes(jour) ? "checked" : ""}>
          <span>${jour}</span>
        </label>
      `).join("");

      partiDisponibilite.innerHTML = `
        <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-6 max-w-xl mx-auto shadow">
          <h2 class="text-xl font-semibold text-indigo-700 mb-1">${medecin.name}</h2>
          <p class="text-sm text-gray-600 mb-4">Spécialité : ${medecin.specialty}</p>

          <h3 class="text-sm font-medium text-gray-700 mb-2">Jours de travail</h3>
          <div class="grid grid-cols-2 gap-2 mb-4">${checkboxesHTML}</div>

          <div class="text-center">
            <button id="save-btn" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
              Sauvegarder
            </button>
          </div>

          <p id="message" class="text-green-600 text-center mt-4 hidden">
            Disponibilités mises à jour !
          </p>
        </div>
      `;

      document.getElementById("save-btn").addEventListener("click", () => {
        const checkboxes = document.querySelectorAll(".jour-checkbox");

        medecin.jours = []

        checkboxes.forEach(c => {
          if (c.checked) medecin.jours.push(c.value);
        });

        localStorage.setItem("disponibilites", JSON.stringify(mede));

        localStorage.setItem("medicareDoctors", JSON.stringify(mede));
        // localStorage.setItem( "medicareDoctors.jours",JSON.stringify(joursSelect))

        const msg = document.getElementById("message");
        msg.classList.remove("hidden");
        setTimeout(() => msg.classList.add("hidden"), 2000);
      });
    }
