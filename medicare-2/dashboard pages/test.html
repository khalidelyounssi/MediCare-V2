<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Admin - Disponibilité</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-blue-700 text-white p-6 shadow-xl flex flex-col justify-between">
            <div>
                <div class="text-2xl font-bold flex items-center justify-center gap-2 mb-8 border-b border-blue-600 pb-4">
                    <i class="fas fa-medkit text-3xl text-white"></i>
                    <span>MediCare Admin</span>
                </div>
                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center p-3 rounded-lg text-blue-100 hover:bg-blue-600 transition duration-200">
                        <i class="fas fa-home mr-3"></i>
                        Accueil
                    </a>
                    <a href="medecins.html" class="flex items-center p-3 rounded-lg text-blue-100 hover:bg-blue-600 transition duration-200">
                        <i class="fas fa-user-md mr-3"></i>
                        Médecins
                    </a>
                    <a href="disponibilites.html" class="flex items-center p-3 rounded-lg bg-blue-800 text-white font-semibold transition duration-200">
                        <i class="fas fa-clock mr-3"></i>
                        Disponibilité
                    </a>
                    <a href="rendezvous.html" class="flex items-center p-3 rounded-lg text-blue-100 hover:bg-blue-600 transition duration-200">
                        <i class="fas fa-calendar-check mr-3"></i>
                        Rendez-vous
                    </a>
                    <a href="specialites.html" class="flex items-center p-3 rounded-lg text-blue-100 hover:bg-blue-600 transition duration-200">
                        <i class="fas fa-tag mr-3"></i>
                        Spécialité
                    </a>
                </nav>
            </div>
            <div class="flex items-center p-4 border-t border-blue-600 mt-4">
                <img src="../assets/doc-1.png" alt="Admin Avatar" class="w-10 h-10 rounded-full object-cover border-2 border-white">
                <span class="ml-3 text-sm font-medium">Dr. Sofia Rahman</span>
            </div>
        </aside>

        <main class="flex-grow p-8">
            <header class="flex justify-between items-center pb-4 mb-6 border-b border-gray-300">
                <h1 class="text-3xl font-semibold text-gray-800">Gestion des Disponibilités</h1>
                <div class="flex items-center space-x-4">
                    <i class="fas fa-bell text-xl text-gray-500 hover:text-blue-600 cursor-pointer"></i>
                    <i class="fas fa-cog text-xl text-gray-500 hover:text-blue-600 cursor-pointer"></i>
                    <div class="relative">
                        <input type="text" placeholder="Rechercher..." class="p-2 pl-10 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 w-64">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                    <img src="../assets/doc-1.png" alt="Admin Avatar" class="w-9 h-9 rounded-full object-cover cursor-pointer">
                </div>
            </header>

            <h1 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
      Gérer les disponibilités des médecins
    </h1>

    <!-- Sélection du médecin -->
    <div class="mb-8">
      <label for="medecin" class="block text-sm font-medium text-gray-700 mb-2">
        Sélectionner un médecin
      </label>
      <select id="medecin" class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <option>-- Choisir un médecin --</option>
        <option>Dr. Amine Benali — Cardiologue</option>
        <option>Dr. Sara El Khouli — Dermatologue</option>
        <option>Dr. Mohamed Idrissi — Dentiste</option>
        <option>Dr. Amina Bouchra — Pédiatre</option>
      </select>
    </div>

    <!-- Informations sur le médecin sélectionné (statique ici) -->
    <div class="mb-8 bg-indigo-50 border border-indigo-200 rounded-lg p-4">
      <h2 class="text-lg font-semibold text-indigo-700">Dr. Amine Benali</h2>
      <p class="text-sm text-gray-600">Spécialité : Cardiologue</p>
    </div>

    <!-- Jours de travail -->
    <div class="mb-6">
      <h3 class="text-sm font-medium text-gray-700 mb-2">Jours de travail</h3>
      <div class="grid grid-cols-2 gap-2 text-gray-700">
        <label class="flex items-center space-x-2">
          <input id="lundi" type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Lundi</span>
        </label>
        <label class="flex items-center space-x-2">
          <input id="Mardi" type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Mardi</span>
        </label>
        <label class="flex items-center space-x-2">
          <input id="Mercredi" type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Mercredi</span>
        </label>
        <label class="flex items-center space-x-2">
          <input id="Jeudi" type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Jeudi</span>
        </label>
        <label class="flex items-center space-x-2">
          <input id="Vendredi" type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Vendredi</span>
        </label>
        <label class="flex items-center space-x-2">
          <input id="Samedi" type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Samedi</span>
        </label>
        <label class="flex items-center space-x-2">
          <input id="Dimanche" type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Dimanche</span>
        </label>
      </div>
    </div>

    <!-- Bouton -->
    <div class="text-center">
      <button  id="checkJour"  class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
        Sauvegarder
      </button>
    </div>

    <!-- Message de confirmation -->
    <p class="text-green-600 text-center mt-4 font-medium">
      Disponibilités mises à jour
    </p>

</main>
    </div>

    <script>

  let joursSelectionnes = [];

  const checkJourBtn = document.getElementById('checkJour');
  const checkboxes = document.querySelectorAll('input[type="checkbox"]');

  checkJourBtn.addEventListener('click', () => {
    joursSelectionnes = [];

    checkboxes.forEach((checkbox) => {
      if (checkbox.checked) {
        const jourNom = checkbox.nextElementSibling.textContent.trim();
        joursSelectionnes.push(jourNom);
      }
    });

    localStorage.setItem('joursSelectionnes', JSON.stringify(joursSelectionnes));
    
  });

  window.addEventListener('load', () => {
    const sauvegardees = localStorage.getItem('joursSelectionnes');
    if (sauvegardees) {
      const jours = JSON.parse(sauvegardees);
      checkboxes.forEach((checkbox) => {
        const jourNom = checkbox.nextElementSibling.textContent.trim();
        if (jours.includes(jourNom)) {
          checkbox.checked = true;
        }
      });
    }
  });
  
</script>


    

</body>
</html>
