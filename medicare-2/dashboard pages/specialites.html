<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Admin - Tableau de bord</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body class="bg-gray-100 font-sans antialiased">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-blue-700 text-white p-6 shadow-xl flex flex-col justify-between hidden md:flex  ">
            <div>
                <div
                    class="text-2xl font-bold flex items-center justify-center gap-2 mb-8 border-b border-blue-600 pb-4">
                    <i class="fas fa-medkit text-3xl text-white"></i>
                    <span>MediCare Admin</span>
                </div>
                <!-- Desktop -->
                <nav class="space-y-2 ">
                    <a href="dashboard.html"
                        class="flex items-center p-3 rounded-lg text-blue-100 hover:bg-blue-600 transition duration-200">
                        <i class="fas fa-home mr-3"></i>
                        Accueil
                    </a>
                    <a href="medecins.html"
                        class="flex items-center p-3 rounded-lg text-blue-100 hover:bg-blue-600 transition duration-200">
                        <i class="fas fa-user-md mr-3"></i>
                        Médecins
                    </a>
                    <a href="disponibilites.html"
                        class="flex items-center p-3 rounded-lg text-blue-100 hover:bg-blue-600 transition duration-200">
                        <i class="fas fa-clock mr-3"></i>
                        Disponibilité
                    </a>
                    <a href="rendezvous.html"
                        class="flex items-center p-3 rounded-lg text-blue-100 hover:bg-blue-600 transition duration-200">
                        <i class="fas fa-calendar-check mr-3"></i>
                        Rendez-vous
                    </a>
                    <a href="specialites.html"
                        class="flex items-center p-3 rounded-lg bg-blue-800 text-white font-semibold transition duration-200">
                        <i class="fas fa-tag mr-3"></i>
                        Spécialité
                    </a>
                </nav>

            </div>
            <div class="flex flex-col flex- p-4 border-t border-blue-600 mt-4 ">
                <div class=" flex items-center ">
                    <img src="../../images/doc-2.png" alt="Admin Avatar"
                        class="w-10 h-10 rounded-full object-cover border-2 border-white">
                    <span class="ml-3 text-sm font-medium">Dr. Sofia Rahman</span>
                </div>
                <div id="deconnecter" class="flex items-center mt-4 border-2 w-full p-1.5 rounded-2xl ">
                    <i class="fas fa-sign-out-alt ml-4 "></i>
                    <span  class="ml-3 text-sm font-medium">se déconnecter</span>
                </div>
            </div>
        </aside>
        

                <!-- Bottom Nav Mobile -->
                <nav
                    class="flex md:hidden fixed bottom-0 left-0 right-0  bg-blue-700 text-white justify-between gap- p-1.5 mb-[0.5rem] rounded-2xl h-[40px] mx-3 z-50">
                    <a href="dashboard.html"
                        class="flex items-center p-3 rounded-lg text-blue-100 hover:bg-blue-600 transition duration-200">
                        <i class="fas fa-home mr-3"></i>
                    </a>
                    <a href="medecins.html"
                        class="flex items-center p-3 rounded-lg text-blue-100 hover:bg-blue-600 transition duration-200">
                        <i class="fas fa-user-md mr-3"></i>
                    </a>
                    <a href="disponibilites.html"
                        class="flex items-center p-3 rounded-lg text-blue-100 hover:bg-blue-600 transition duration-200">
                        <i class="fas fa-clock mr-3"></i>

                    </a>
                    <a href="rendezvous.html"
                        class="flex items-center p-3 rounded-lg text-blue-100 hover:bg-blue-600 transition duration-200">
                        <i class="fas fa-calendar-check mr-3"></i>
                    </a>
                    <a href="specialites.html"
                        class="flex items-center p-3 rounded-lg bg-blue-800 text-white font-semibold transition duration-200">
                        <i class="fas fa-tag mr-3"></i>
                    </a>
                </nav>

        <main class="flex-grow p-8">
            <header class="flex justify-between items-center pb-4 mb-6 border-b border-gray-300">
                <h1 class="md:text-3xl font-semibold text-gray-800 text-xl">Tableau de bord principal</h1>
                <div class="flex items-center space-x-4 ">
                    <img src="../../images/doc-2.png" alt="Admin Avatar"
                        class="w-9 h-9 rounded-full object-cover cursor-pointer">
                    <i id="signOut" class="fas fa-sign-out-alt ml-4 border-2 p-3 rounded-[50%] text-gray-500 hover:text-blue-600 md:hidden"></i>
                </div>
            </header>
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center">
                <h1 class="text-xl font-bold text-gray-800">Gestion des Spécialités Médicales</h1>
                <button  id="btnAjo" class="bg-green-500 -600 hover:bg-green-900 -700 text-white px-6 py-2 rounded-lg flex items-center gap-2">
                    <span class="text-xl">+</span>
                    <span>Ajouter une spécialité</span>
                </button>
            </div>
        </div>

        <div id="formil" class="bg-white rounded-lg shadow-md p-6 mb-6 hidden">
            <h2 id="titreFormil" class="text-2xl font-bold text-gray-800 mb-4">Ajouter une spécialité</h2>
            <form  class="space-y-4">
                <input type="hidden" id="specialiteId" value="">
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Nom de la spécialité *</label>
                    <input type="text" id="nomSpecialite" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Ex: Cardiologie">
                </div>

                <div>
                    <label   class="block text-gray-700 font-semibold mb-2">Description</label>
                    <textarea 
                              id="descSpecialite" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                              placeholder="Description courte de la spécialité..."></textarea>
                </div>

                <div class="flex gap-3">
                    <button type="button" id="btnEnre" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg">
                        💾 Enregistrer
                    </button>
                    <button type="button" id="btnAnnuler"  class="bg-gray-400 hover:bg-gray-500 text-white px-6 py-2 rounded-lg">
                        ❌ Annuler
                    </button>
                </div>
            </form>
        </div>



        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="px-6 py-3 text-left text-sm font-bold text-gray-700">Spécialité</th>
                            <th class="px-6 py-3 text-left text-sm font-bold text-gray-700">Description</th>
                            
                            <th class="px-6 py-3 text-center text-sm font-bold text-gray-700">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="listeSpecialites" class="divide-y divide-gray-200">
                        
                    </tbody>
                </table>
            </div>
        </div>
        
        <div  class="hidden bg-yellow-50 border border-yellow-200 rounded-lg p-6 text-center">
            <p class="text-gray-600 text-lg">Aucune spécialité pour le moment. Ajoutez-en une nouvelle !</p>
        </div>
    </div>

    <script src="../js/specialites.js"></script>
</body>
</html>
